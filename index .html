<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BacheUy · Pozos y calles en mal estado en Uruguay</title>
<meta name="description" content="Marcá en el mapa los pozos y calles rotas de tu barrio y seguí si los arreglan.">
<meta property="og:title" content="BacheUy">
<meta property="og:description" content="Mapa ciudadano de pozos y calles en mal estado en Uruguay.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#667085;--bd:#e3e6eb;--ac:#1d6fd8;--p:#d92d20;--map:#dfe6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222c;--tx:#eef1f5;--mu:#9aa5b5;--bd:#2c3644;--ac:#5b9cf0;--map:#1d2630;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h1 span{color:var(--ac)}
.sub{font-size:12px;color:var(--mu)}
#map{flex:0 0 40%;background:var(--map);position:relative;z-index:0}
#panel{flex:1;overflow:auto;position:relative;padding:10px 12px 90px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.sel{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{display:inline-block;font-size:11px;font-weight:600;color:#fff;border-radius:6px;padding:2px 7px;margin-right:4px}
.meta{font-size:12px;color:var(--mu);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
button{font:inherit;cursor:pointer}button:disabled{opacity:.6}
.btn{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 8px;font-size:13px}
.btn.red{border-color:var(--p);color:var(--p)}.btn.grn{border-color:#1a9e5c;color:#1a9e5c}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:99px;padding:13px 20px;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:900}
#form{position:absolute;inset:0;background:var(--bg);padding:12px;overflow:auto;z-index:5;display:none}
#form.show{display:block}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:13px;background:var(--card);border:1px dashed var(--ac);border-radius:10px;padding:8px 10px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);color:#fff;font-size:12px}
.empty{text-align:center;color:var(--mu);padding:24px 0}
#cross{position:absolute;left:50%;top:50%;width:0;height:0;z-index:1000;pointer-events:none;display:none}
#cross i{position:absolute;left:-14px;top:-34px;width:28px;height:34px;font-style:normal;font-size:28px;line-height:34px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#cross u{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--p);border:1px solid #fff}
.thumb{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
#prev{max-width:100%;max-height:140px;border-radius:10px;margin-top:8px;display:none}
</style></head>
<body>
<header><div><h1>Bache<span>Uy</span></h1><div class="sub">Reportes ciudadanos de calles en mal estado</div></div><div class="sub" id="count"></div></header>
<div id="map"><div id="cross"><i>📍</i><u></u></div></div>
<div id="panel">
  <div class="chips" id="fs"></div>
  <div class="chips" id="fv"></div>
  <div id="list"><div class="empty">Cargando reportes…</div></div>
  <div id="form">
    <b style="font-size:17px">Nuevo reporte</b>
    <div class="hint" id="loc" style="margin-top:8px"></div>
    <button class="btn" style="width:100%;margin-top:8px" id="gps">📍 Usar mi ubicación</button>
    <div class="row"><div><label>Categoría</label><select id="cat"><option>Pozo profundo</option><option>Calle intransitable</option><option>Alcantarilla sin tapa</option><option>Obra sin señalizar</option><option>Otro</option></select></div>
    <div><label>Gravedad</label><select id="sev"><option>Leve</option><option selected>Grave</option><option>Peligroso</option></select></div></div>
    <label>Descripción</label><textarea id="desc" rows="3" maxlength="300" placeholder="Ej.: Pozo grande frente al número 1234"></textarea>
    <label>Foto (opcional)</label><input type="file" id="photo" accept="image/*"><img id="prev" alt="Vista previa">
    <div class="meta">La fecha se registra automáticamente.</div>
    <div class="acts"><button class="btn" id="cancel">Cancelar</button><button class="btn pri" id="save">Guardar reporte</button></div>
  </div>
</div>
<button id="fab">＋ Reportar</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
/* ====== CONFIGURACIÓN: pegá acá los dos datos de tu proyecto de Supabase ====== */
const SUPABASE_URL="https://uzvxxbbuwcxyzaxexolg.supabase.co";
const SUPABASE_KEY="sb_publishable_BcAN9Nr3na1WbYCLRbyI2Q_-3tUJnY5";
/* ============================================================================== */
const COL={Leve:"#e0a800",Grave:"#ef7d00",Peligroso:"#d92d20"},DAY=864e5,HINT="Movés el mapa hasta que el pin 📍 quede justo sobre el pozo.";
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/DAY));
const fmt=d=>new Date(d).toLocaleDateString("es-UY",{day:"numeric",month:"short",year:"numeric"});
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();
let dev=ls("bacheuy:dev");if(!dev){dev=uid();ls("bacheuy:dev",dev)}
let voted={};try{voted=JSON.parse(ls("bacheuy:voted")||"{}")}catch(e){}
let sb=null;const ok=!SUPABASE_URL.startsWith("PEGAR");
if(ok){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){console.error(e)}}
let R=[],fs="Todos",fv="Todas",sel=null,adding=false,acc=null,accC=null,photo=null;
const map=L.map("map").setView([-32.8,-56],7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const icon=r=>L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,26],html:`<div class="pin" style="background:${r.st==="Reparado"?"#8a94a6":COL[r.sev]}"><b>${r.st==="Reparado"?"✓":"!"}</b></div>`});
const vis=()=>R.filter(r=>(fs==="Todos"||r.st===(fs==="Pendientes"?"Pendiente":"Reparado"))&&(fv==="Todas"||r.sev===fv));
function chips(el,arr,cur,fn){el.innerHTML=arr.map(a=>`<button class="chip${a===cur?" on":""}">${a}</button>`).join("");[...el.children].forEach((b,i)=>b.onclick=()=>{fn(arr[i]);render()})}
function render(){
  chips($("fs"),["Todos","Pendientes","Reparados"],fs,v=>fs=v);
  chips($("fv"),["Todas","Leve","Grave","Peligroso"],fv,v=>fv=v);
  const list=vis().sort((a,b)=>(a.st==="Reparado")-(b.st==="Reparado")||new Date(a.date)-new Date(b.date));
  $("count").textContent=R.filter(r=>r.st==="Pendiente").length+" pendientes";
  layer.clearLayers();
  list.forEach(r=>L.marker([r.lat,r.lng],{icon:icon(r)}).on("click",()=>{sel=r.id;render();const e=document.getElementById("r"+r.id);e&&e.scrollIntoView({behavior:"smooth",block:"nearest"})}).addTo(layer));
  $("list").innerHTML=list.length?list.map(r=>`<div class="card${r.id===sel?" sel":""}" id="r${esc(r.id)}">
   <div class="top"><div><span class="badge" style="background:${COL[r.sev]}">${esc(r.sev)}</span><span class="badge" style="background:${r.st==="Reparado"?"#1a9e5c":"#667085"}">${esc(r.st)}</span></div><div class="meta" style="margin:0">${r.st==="Pendiente"?"Abierto hace "+days(r.date)+" d":"Reparado"}</div></div>
   <div style="margin-top:6px"><b>${esc(r.cat)}</b></div><div>${esc(r.desc||"Sin descripción")}</div>${r.img?`<img class="thumb" loading="lazy" src="${esc(r.img)}" alt="Foto del reporte">`:""}
   <div class="meta">Reportado el ${fmt(r.date)} · ${r.v} confirman · ${r.f} dicen arreglado</div>
   ${r.st==="Pendiente"?(voted[r.id]?'<div class="meta">Ya votaste en este reporte.</div>':`<div class="acts"><button class="btn red" data-a="v" data-i="${esc(r.id)}">⚠️ Sigue roto</button><button class="btn grn" data-a="f" data-i="${esc(r.id)}">✅ Ya lo arreglaron</button></div>`):""}
   <div class="acts"><button class="btn" data-a="g" data-i="${esc(r.id)}">Ver en el mapa</button></div></div>`).join(""):'<div class="empty">Todavía no hay reportes. ¡Sé el primero en reportar uno!</div>';
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
  document.querySelectorAll(".thumb").forEach(i=>i.onclick=()=>{i.style.maxHeight=i.style.maxHeight?"":"none"});
}
async function load(){
  if(!sb){$("list").innerHTML='<div class="empty">Falta configurar Supabase en index.html (ver la guía).</div>';return}
  const {data,error}=await sb.from("reports").select("*").order("created_at",{ascending:true}).limit(1000);
  if(error){console.error(error);$("list").innerHTML='<div class="empty">No se pudieron cargar los reportes. Revisá la configuración.</div>';return}
  R=data.map(x=>({id:x.id,lat:x.lat,lng:x.lng,cat:x.category,sev:x.severity,desc:x.description,img:x.photo_url,date:x.created_at,st:x.status,v:x.confirm_votes,f:x.fixed_votes}));
  render();
}
async function act(a,id){const r=R.find(x=>x.id===id);if(!r)return;
  if(a==="g"){sel=id;map.setView([r.lat,r.lng],16);render();return}
  if(voted[id]){alert("Ya votaste en este reporte.");return}
  const {error}=await sb.rpc("cast_vote",{p_report:id,p_device:dev,p_kind:a==="v"?"still":"fixed"});
  if(error){console.error(error);alert("No se pudo registrar tu voto.");return}
  voted[id]=1;ls("bacheuy:voted",JSON.stringify(voted));load()}
function updLoc(){if(!adding)return;const c=map.getCenter();$("loc").innerHTML="Ubicación: "+c.lat.toFixed(5)+", "+c.lng.toFixed(5)+(acc?" · GPS ±"+Math.round(acc)+" m":"")+(map.getZoom()<16?"<br><b>Acercá el mapa (zoom 16 o más) y ubicá el pin sobre el pozo.</b>":"")}
map.on("move",updLoc);
function openForm(){adding=true;acc=null;$("form").classList.add("show");$("fab").style.display="none";$("cross").style.display="block";updLoc()}
function closeForm(){adding=false;acc=null;photo=null;$("form").classList.remove("show");$("fab").style.display="";$("cross").style.display="none";if(accC){map.removeLayer(accC);accC=null}$("desc").value="";$("photo").value="";$("prev").style.display="none";$("loc").textContent=HINT}
map.on("click",e=>{if(adding)map.panTo(e.latlng)});
$("loc").textContent=HINT;$("fab").onclick=openForm;$("cancel").onclick=closeForm;
$("photo").onchange=e=>{const f=e.target.files[0];photo=null;$("prev").style.display="none";if(!f)return;
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>{photo=b;$("prev").src=URL.createObjectURL(b);$("prev").style.display="block"},"image/jpeg",.7)};
  im.onerror=()=>alert("No se pudo leer la imagen.");im.src=u};
$("gps").onclick=()=>{if(!navigator.geolocation){alert("Tu navegador no permite geolocalización.");return}
  $("gps").textContent="Buscando señal GPS…";let best=null;
  const stop=()=>{navigator.geolocation.clearWatch(id);$("gps").textContent="📍 Usar mi ubicación"};
  const id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy){best=p;const ll=L.latLng(p.coords.latitude,p.coords.longitude);acc=p.coords.accuracy;map.setView(ll,18,{animate:false});if(accC)accC.setLatLng(ll).setRadius(acc);else accC=L.circle(ll,{radius:acc,weight:1}).addTo(map);updLoc()}if(p.coords.accuracy<=15)stop()},()=>{stop();if(!best)alert("No se pudo obtener tu ubicación. Movés el mapa para marcarla.")},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  setTimeout(stop,8000)};
$("save").onclick=async()=>{if(!sb){alert("Falta configurar Supabase.");return}
  const c=map.getCenter();
  if(map.getZoom()<15&&!confirm("El mapa está muy alejado y la ubicación puede ser imprecisa. ¿Guardar igual?"))return;
  const btn=$("save");btn.disabled=true;btn.textContent="Guardando…";
  try{let url=null;
    if(photo){const path=uid()+".jpg",{error:e1}=await sb.storage.from("report-photos").upload(path,photo,{contentType:"image/jpeg"});if(e1)throw e1;url=sb.storage.from("report-photos").getPublicUrl(path).data.publicUrl}
    const {error}=await sb.from("reports").insert({lat:c.lat,lng:c.lng,category:$("cat").value,severity:$("sev").value,description:$("desc").value.trim().slice(0,300)||null,photo_url:url});
    if(error)throw error;
    closeForm();await load();map.setView([c.lat,c.lng],17);
  }catch(e){console.error(e);alert("No se pudo guardar el reporte. Revisá tu conexión e intentá de nuevo.")}
  btn.disabled=false;btn.textContent="Guardar reporte"};
render();load();
setInterval(()=>{if(!adding&&!document.hidden)load()},60000);
</script></body></html>
